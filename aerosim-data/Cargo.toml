[package]
name = "aerosim-data"
version.workspace = true
edition.workspace = true
description.workspace = true
authors.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "aerosim_data"
crate-type = ["cdylib", "rlib"]

[dependencies]
aerosim-macros = { path = "../aerosim-macros" }
chrono.workspace = true
pyo3.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
strum_macros.workspace = true
async-trait = "0.1"
bincode = "1.3"
ctor = "0.2.8"
enum_dispatch = "0.3.13"
futures = "0.3.31"
pythonize = "0.23.0"
schemars = "0.8.22"
serde_bytes="0.11.16"
serde_repr = "0.1.20"
turbojpeg = { version = "1.3.0", default-features = false, features = ["cmake"] }

[features]
default = ["zenoh"]
middleware = ["r2r", "dds", "kafka", "zenoh"]

dds = ["cyclors", "cdr"]
kafka = ["rdkafka", "futures-util", "tokio"]
zenoh = ["dep:zenoh", "tokio"]

[dependencies.r2r]
version = "0.9.1"
optional = true

[dependencies.cyclors]
version = "0.3.3"
optional = true

[dependencies.cdr]
version = "0.2.4"
optional = true

[dependencies.rdkafka]
version = "0.35.0"
features = ["cmake-build"]
optional = true

[dependencies.futures-util]
version = "0.3"
optional = true

[dependencies.tokio]
version = "1.0"
features = ["full"]
optional = true

[dependencies.zenoh]
version = "1.4.0"
optional = true

[dev-dependencies]
tokio.workspace = true


# To enable the "middleware" feature, use the following command:
# cargo build --features "middleware"
