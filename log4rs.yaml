refresh_rate: 30 seconds
appenders:
  stdout:
    kind: console
    encoder:
      pattern: "{d} [{t}] {m}{n}"
  simlog:
    kind: file
    path: "log/aerosim.log"
    encoder:
      pattern: "{d} [{t}] {m}{n}"
root:
  level: info
  appenders:
    - stdout
    - simlog
loggers:
  info:  # fmi crate logs info messages with logger target as "info"
    level: warn  # change to "warn" level to filter out fmi info messages
    